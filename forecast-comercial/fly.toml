# Troque "app" por um nome único antes do primeiro deploy (fly apps create <nome>).
app = "forecast-comercial"
primary_region = "gru"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/forecast.db"

[[mounts]]
  source = "forecast_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
