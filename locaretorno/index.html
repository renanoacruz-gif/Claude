<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1B3A4B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="LocaRetorno — vistoria de devolução com prova fotográfica para locadoras.">
  <title>LocaRetorno</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231B3A4B'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial'%3E↩%3C/text%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231B3A4B'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial'%3E↩%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <!-- Tela de PIN -->
  <div id="pin-screen" class="screen hidden">
    <div class="pin-box">
      <div class="pin-logo">↩</div>
      <h1>LocaRetorno</h1>
      <p class="pin-sub">Aplicativo de balcão — vistoria de devolução</p>
      <div id="pin-dots" class="pin-dots"></div>
      <div class="pin-keypad" id="pin-keypad"></div>
      <button id="pin-biometry" class="btn btn-ghost hidden">🔒 Desbloquear com biometria</button>
      <p class="pin-hint">PIN padrão de demonstração: <strong>1234</strong></p>
    </div>
  </div>

  <!-- App principal -->
  <div id="app" class="hidden">
    <header class="topbar">
      <div class="brand">↩ LocaRetorno</div>
      <div class="conn-badge" id="conn-badge"><span class="dot"></span><span id="conn-text">Online</span></div>
    </header>

    <main id="view-root" class="view-root"><!-- views renderizadas aqui --></main>

    <footer class="bottom-bar hidden" id="bottom-bar"></footer>
  </div>

  <!-- Modal genérico (avaria) -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-content" class="modal-card" role="dialog" aria-modal="true"></div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>

  <script>
    // Registro do Service Worker (PWA offline) — só em http(s)/localhost
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch((e) => console.warn('SW:', e));
      });
    }
  </script>
</body>
</html>
