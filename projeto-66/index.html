<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0f">
  <meta name="description" content="Projeto 66 — Gestão à Vista. Sistema operacional de execução pessoal: 66 dias para consolidar hábitos com disciplina, gamificação e melhoria contínua.">
  <title>Projeto 66 | Gestão à Vista</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="app" class="app">

    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-mark" aria-hidden="true">66</div>
        <div class="brand-text">
          <strong>PROJETO 66</strong>
          <span>Gestão à Vista</span>
        </div>
      </div>

      <button class="btn-war" data-action="war-mode" title="Modo Guerra (G)">
        <span class="btn-war-icon" data-icon="sword"></span> MODO GUERRA
      </button>

      <nav class="sidebar-nav" id="nav">
        <div class="nav-group">
          <span class="nav-group-label">Execução</span>
          <a href="#/dashboard" data-route="dashboard"><span data-icon="target"></span>Início<kbd>1</kbd></a>
          <a href="#/hoje" data-route="hoje"><span data-icon="clock"></span>Hoje<kbd>2</kbd></a>
          <a href="#/missoes" data-route="missoes"><span data-icon="flag"></span>Missões<kbd>3</kbd></a>
        </div>
        <div class="nav-group">
          <span class="nav-group-label">Inteligência</span>
          <a href="#/guerra" data-route="guerra"><span data-icon="radar"></span>Sala de Guerra<kbd>4</kbd></a>
          <a href="#/evolucao" data-route="evolucao"><span data-icon="chart"></span>Evolução<kbd>5</kbd></a>
          <a href="#/integral" data-route="integral"><span data-icon="compass"></span>Homem Integral<kbd>6</kbd></a>
          <a href="#/claudi" data-route="claudi"><span data-icon="spark"></span>Claudi<kbd>7</kbd></a>
        </div>
        <div class="nav-group">
          <span class="nav-group-label">Identidade</span>
          <a href="#/conquistas" data-route="conquistas"><span data-icon="trophy"></span>Conquistas<kbd>8</kbd></a>
          <a href="#/reflexao" data-route="reflexao"><span data-icon="pen"></span>Reflexão<kbd>9</kbd></a>
          <a href="#/responsabilidade" data-route="responsabilidade"><span data-icon="shield"></span>Responsabilidade<kbd>0</kbd></a>
          <a href="#/porque" data-route="porque"><span data-icon="anchor"></span>Por que continuo?</a>
        </div>
      </nav>

      <div class="sidebar-foot">
        <a href="#/config" data-route="config" class="nav-config"><span data-icon="gear"></span>Configurações</a>
        <div class="sidebar-level" id="sidebar-level"></div>
      </div>
    </aside>
    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    <!-- ===== Main ===== -->
    <main class="main" id="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" data-action="toggle-sidebar" aria-label="Menu"><span data-icon="menu"></span></button>
        <div class="topbar-quote" id="topbar-quote" title="Clique para outra frase" data-action="new-quote"></div>
        <div class="topbar-right">
          <span class="topbar-clock" id="topbar-clock"></span>
          <button class="icon-btn" data-action="help" title="Atalhos (?)"><span data-icon="keyboard"></span></button>
        </div>
      </header>
      <div class="view" id="view" tabindex="-1"></div>
    </main>
  </div>

  <!-- ===== Overlays ===== -->
  <div class="overlay war-overlay" id="war-overlay" hidden></div>
  <div class="overlay celebrate-overlay" id="celebrate-overlay" hidden></div>
  <div class="overlay modal-overlay" id="modal-overlay" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="chart-tip" id="chart-tip" hidden></div>

  <script src="js/config.js"></script>
  <script src="js/quotes.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/store.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/claudi.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
