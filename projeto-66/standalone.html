<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0c0f">
<title>Projeto 66 | Gestão à Vista</title>
<style>
/* =============================================================
   PROJETO 66 | Gestão à Vista — design system
   Dark premium: grafite profundo + âmbar tático.
   Inspiração: Linear, Tesla UI, Garmin, Apple Fitness.
   ============================================================= */

:root {
  --bg: #0b0c0f;
  --surface: #14161a;
  --surface-2: #1a1d23;
  --surface-3: #21252c;
  --border: rgba(255, 255, 255, 0.07);
  --border-strong: rgba(255, 255, 255, 0.13);
  --ink: #f2f3f5;
  --ink-2: #9ba1ab;
  --ink-3: #5f6670;
  --accent: #f0b445;        /* âmbar claro: texto/realce */
  --accent-deep: #c9821f;   /* âmbar marca: séries/preenchimentos */
  --accent-dim: rgba(240, 180, 69, 0.12);
  --good: #199e70;
  --good-text: #3ddc97;
  --good-dim: rgba(25, 158, 112, 0.12);
  --bad: #e5484d;
  --bad-text: #f2555a;
  --bad-dim: rgba(229, 72, 77, 0.12);
  --info: #3987e5;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sidebar-w: 252px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--ink);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100dvh;
  overflow-x: hidden;
}
img { max-width: 100%; }
a { color: var(--accent); text-decoration: none; }
button { font-family: inherit; }
::selection { background: var(--accent-deep); color: #0b0c0f; }

kbd {
  background: var(--surface-3);
  border: 1px solid var(--border-strong);
  border-bottom-width: 2px;
  border-radius: 5px;
  padding: 1px 6px;
  font-size: 11px;
  font-family: inherit;
  color: var(--ink-2);
}

/* ícones inline */
.i, [data-icon] { display: inline-flex; }
.i svg, [data-icon] svg { width: 16px; height: 16px; }

/* ================= layout ================= */
.app { display: flex; min-height: 100dvh; }

.sidebar {
  width: var(--sidebar-w);
  background: #0e1013;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 18px 14px;
  position: sticky;
  top: 0;
  height: 100dvh;
  overflow-y: auto;
  flex-shrink: 0;
  z-index: 40;
}

.sidebar-brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 8px; }
.brand-mark {
  width: 40px; height: 40px;
  display: grid; place-items: center;
  background: linear-gradient(145deg, var(--accent-deep), #8a5512);
  color: #0b0c0f;
  font-weight: 800; font-size: 17px;
  border-radius: 10px;
  letter-spacing: -0.5px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.25);
}
.brand-text { display: flex; flex-direction: column; line-height: 1.2; }
.brand-text strong { font-size: 14px; letter-spacing: 2px; }
.brand-text span { font-size: 11px; color: var(--ink-3); letter-spacing: 0.5px; }

.btn-war {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  background: linear-gradient(160deg, #2a1d0c, #1c1409);
  border: 1px solid rgba(240, 180, 69, 0.35);
  color: var(--accent);
  font-weight: 700; font-size: 12.5px; letter-spacing: 2.5px;
  padding: 11px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.18s;
}
.btn-war:hover { background: #2e2110; border-color: var(--accent); box-shadow: 0 0 18px rgba(240, 180, 69, 0.15); }
.btn-war-icon svg { width: 15px; height: 15px; }

.sidebar-nav { display: flex; flex-direction: column; gap: 16px; flex: 1; }
.nav-group { display: flex; flex-direction: column; gap: 1px; }
.nav-group-label {
  font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--ink-3); padding: 0 10px 6px;
}
.sidebar-nav a, .nav-config {
  display: flex; align-items: center; gap: 10px;
  color: var(--ink-2);
  font-size: 13.5px;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  transition: background 0.15s, color 0.15s;
}
.sidebar-nav a kbd { margin-left: auto; opacity: 0; transition: opacity 0.15s; }
.sidebar-nav a:hover kbd { opacity: 1; }
.sidebar-nav a:hover, .nav-config:hover { background: var(--surface-2); color: var(--ink); }
.sidebar-nav a.active {
  background: var(--accent-dim);
  color: var(--accent);
}
.sidebar-nav a.active svg { stroke: var(--accent); }

.sidebar-foot { display: flex; flex-direction: column; gap: 12px; }
.sidebar-level { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; }
.lvl-head { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; }
.lvl-head span { color: var(--ink-3); }
.lvl-bar { height: 5px; background: var(--surface-3); border-radius: 4px; overflow: hidden; }
.lvl-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent-deep), var(--accent)); border-radius: 4px; transition: width 0.5s ease; }
.lvl-next { font-size: 10.5px; color: var(--ink-3); margin-top: 5px; display: block; }

.sidebar-scrim { display: none; }

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 26px;
  border-bottom: 1px solid var(--border);
  background: rgba(11, 12, 15, 0.85);
  backdrop-filter: blur(12px);
  position: sticky; top: 0; z-index: 30;
  min-height: 54px;
}
.menu-btn { display: none; }
.topbar-quote { flex: 1; font-size: 13px; color: var(--ink-2); cursor: pointer; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.topbar-quote:hover { color: var(--ink); }
.q-author { color: var(--ink-3); margin-left: 8px; font-size: 12px; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.topbar-clock { font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.icon-btn {
  background: none; border: none; color: var(--ink-3);
  cursor: pointer; padding: 6px; border-radius: 7px;
  display: inline-flex;
}
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.icon-btn svg { width: 17px; height: 17px; }

.view { padding: 28px 26px 60px; max-width: 1180px; width: 100%; margin: 0 auto; }

/* ================= tipografia / seções ================= */
.section-head { margin: 30px 0 16px; }
.section-head:first-child { margin-top: 0; }
.section-head h2 { font-size: 19px; font-weight: 700; letter-spacing: -0.2px; }
.section-head p { color: var(--ink-3); font-size: 13px; margin-top: 2px; }

/* ================= hero (dashboard) ================= */
.hero { margin-bottom: 22px; }
.hero-kicker { font-size: 12px; letter-spacing: 2px; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.hero h1 { font-size: clamp(26px, 4vw, 38px); font-weight: 800; letter-spacing: -1px; }
.hero-line { font-size: 16px; color: var(--ink-2); margin-top: 2px; }
.hero-line strong { color: var(--accent); font-weight: 700; }

/* ================= missão do dia (barra enorme) ================= */
.mission-bar-wrap {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 22px;
  position: relative;
  overflow: hidden;
}
.mission-bar-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; }
.mission-bar-title { font-size: 13px; font-weight: 800; letter-spacing: 3.5px; color: var(--ink-2); }
.mission-bar-pct { font-size: 34px; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums; }
.mission-bar {
  height: 26px;
  background: var(--surface-3);
  border-radius: 13px;
  overflow: hidden;
  box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.4);
}
.mission-bar-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-deep), var(--accent));
  border-radius: 13px;
  transition: width 0.7s cubic-bezier(0.22, 1, 0.36, 1);
  position: relative;
  min-width: 0;
}
.mission-bar-fill::after {
  content: "";
  position: absolute; inset: 0;
  background: linear-gradient(105deg, transparent 30%, rgba(255, 255, 255, 0.35) 50%, transparent 70%);
  background-size: 220% 100%;
  animation: shimmer 2.8s infinite;
  border-radius: 13px;
}
@keyframes shimmer { 0% { background-position: 130% 0; } 100% { background-position: -90% 0; } }
.mission-bar-wrap.complete { border-color: rgba(25, 158, 112, 0.45); }
.mission-bar-wrap.complete .mission-bar-fill { background: linear-gradient(90deg, #0f7a54, var(--good-text)); }
.mission-bar-wrap.complete .mission-bar-pct { color: var(--good-text); }
.mission-bar-note { margin-top: 10px; font-size: 13px; color: var(--ink-2); }

/* ================= tiles (KPIs) ================= */
.quick-tiles, .kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 22px;
}
.tile {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex; flex-direction: column; gap: 2px;
}
.tile-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-3); }
.tile-value { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; font-variant-numeric: tabular-nums; }
.tile-value small { font-size: 13px; font-weight: 600; color: var(--ink-3); }
.tile-sub { font-size: 12px; color: var(--ink-3); }
.tile-good .tile-value { color: var(--good-text); }
.tile-bad .tile-value { color: var(--bad-text); }

/* ================= cards genéricos ================= */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  margin-bottom: 16px;
}
.card-title { font-size: 14.5px; font-weight: 700; margin-bottom: 4px; }
.card-sub { font-size: 12.5px; color: var(--ink-3); margin-bottom: 12px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-2 .card { margin-bottom: 16px; }
.callout { display: flex; gap: 12px; align-items: flex-start; font-size: 14px; color: var(--ink-2); }
.callout svg { width: 20px; height: 20px; stroke: var(--accent); flex-shrink: 0; margin-top: 2px; }
.callout strong { color: var(--ink); }
.empty { color: var(--ink-3); font-size: 13.5px; padding: 14px 4px; }

/* ================= hábitos (cartões) ================= */
.habit-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 14px;
}
.habit-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  display: flex; flex-direction: column; gap: 8px;
  transition: transform 0.18s, border-color 0.18s, background 0.3s;
  position: relative;
}
.habit-card:hover { transform: translateY(-2px); border-color: var(--border-strong); }
.habit-top { display: flex; justify-content: space-between; align-items: center; }
.habit-icon { display: inline-flex; padding: 9px; background: var(--surface-3); border-radius: 9px; }
.habit-icon svg { width: 19px; height: 19px; stroke: var(--accent); }
.prio { font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 700; padding: 3px 8px; border-radius: 20px; }
.prio-alta { background: var(--bad-dim); color: var(--bad-text); }
.prio-media { background: var(--accent-dim); color: var(--accent); }
.prio-baixa { background: var(--surface-3); color: var(--ink-3); }
.habit-name { font-size: 14.5px; font-weight: 700; letter-spacing: -0.1px; }
.habit-goal { font-size: 12.5px; color: var(--ink-3); flex: 1; }
.habit-meta { display: flex; gap: 12px; font-size: 12px; color: var(--ink-2); align-items: center; }
.habit-meta .i svg { width: 13px; height: 13px; margin-right: 3px; }
.habit-meta span { display: inline-flex; align-items: center; }
.habit-foot { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 2px; }
.habit-streak { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.habit-streak svg { width: 14px; height: 14px; stroke: var(--accent); }
.habit-status { font-size: 11.5px; flex: 1; }
.st-done { color: var(--good-text); }
.st-late { color: var(--bad-text); font-weight: 600; }
.st-pending { color: var(--ink-3); }

.habit-card.done {
  background: linear-gradient(160deg, rgba(25, 158, 112, 0.10), var(--surface) 55%);
  border-color: rgba(25, 158, 112, 0.35);
  animation: winPop 0.45s cubic-bezier(0.22, 1.61, 0.36, 1);
}
.habit-card.done .habit-icon svg { stroke: var(--good-text); }
.habit-card.late { border-color: rgba(229, 72, 77, 0.3); }
@keyframes winPop {
  0% { transform: scale(0.97); }
  55% { transform: scale(1.02); }
  100% { transform: scale(1); }
}

/* ================= botões ================= */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-size: 13.5px; font-weight: 600;
  padding: 9px 16px;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--ink);
  background: var(--surface-3);
}
.btn svg { width: 15px; height: 15px; }
.btn-sm { padding: 6px 12px; font-size: 12.5px; }
.btn-primary {
  background: linear-gradient(160deg, var(--accent), var(--accent-deep));
  color: #14100a;
  font-weight: 700;
}
.btn-primary:hover { filter: brightness(1.1); box-shadow: 0 2px 14px rgba(240, 180, 69, 0.25); }
.btn-secondary { background: var(--surface-3); border-color: var(--border-strong); }
.btn-secondary:hover { background: #262b33; }
.btn-ghost { background: transparent; border-color: var(--border-strong); color: var(--ink-2); }
.btn-ghost:hover { color: var(--ink); border-color: var(--ink-3); }
.btn-danger { background: var(--bad-dim); border-color: rgba(229, 72, 77, 0.4); color: var(--bad-text); }
.btn-danger:hover { background: rgba(229, 72, 77, 0.2); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn-file { position: relative; overflow: hidden; }

/* ================= timeline (Hoje) ================= */
.timeline { position: relative; padding-left: 6px; }
.tl-item { display: flex; align-items: stretch; gap: 14px; position: relative; }
.tl-item:not(:last-child)::before {
  content: "";
  position: absolute;
  left: 74px; top: 30px; bottom: -6px;
  width: 2px;
  background: var(--surface-3);
}
.tl-item.done:not(:last-child)::before { background: rgba(25, 158, 112, 0.4); }
.tl-time { width: 52px; font-size: 13px; font-weight: 700; color: var(--ink-2); padding-top: 16px; font-variant-numeric: tabular-nums; text-align: right; flex-shrink: 0; }
.tl-node {
  width: 13px; height: 13px;
  border-radius: 50%;
  background: var(--surface-3);
  border: 2px solid var(--ink-3);
  margin-top: 19px;
  flex-shrink: 0;
  z-index: 1;
}
.tl-item.done .tl-node { background: var(--good); border-color: var(--good); }
.tl-item.late .tl-node { border-color: var(--bad); }
.tl-item.next .tl-node { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-dim); }
.tl-card {
  flex: 1;
  display: flex; align-items: center; gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 16px;
  margin: 5px 0;
  transition: border-color 0.15s, transform 0.15s;
}
.tl-card[role="button"] { cursor: pointer; }
.tl-card[role="button"]:hover { border-color: var(--accent-deep); transform: translateX(2px); }
.tl-item.next .tl-card { border-color: rgba(240, 180, 69, 0.4); }
.tl-icon { display: inline-flex; }
.tl-icon svg { width: 18px; height: 18px; stroke: var(--ink-2); }
.tl-item.done .tl-icon svg { stroke: var(--good-text); }
.tl-body { flex: 1; display: flex; flex-direction: column; }
.tl-name { font-size: 14px; font-weight: 600; }
.tl-item.done .tl-name { text-decoration: line-through; color: var(--ink-3); }
.tl-meta { font-size: 11.5px; color: var(--ink-3); }
.tl-meta strong { color: var(--accent); letter-spacing: 1px; }
.tl-status { font-size: 12px; display: inline-flex; align-items: center; gap: 5px; }
.tl-status svg { width: 13px; height: 13px; }

/* ================= missões ================= */
.mission-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
.mission-item {
  display: flex; align-items: center; gap: 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 13px 16px;
  transition: border-color 0.2s, background 0.3s;
}
.mission-item.done { background: linear-gradient(160deg, rgba(25, 158, 112, 0.08), var(--surface) 60%); border-color: rgba(25, 158, 112, 0.3); }
.mission-icon { display: inline-flex; padding: 8px; background: var(--surface-3); border-radius: 8px; }
.mission-icon svg { width: 17px; height: 17px; stroke: var(--accent); }
.mission-item.done .mission-icon svg { stroke: var(--good-text); }
.mission-body { flex: 1; display: flex; flex-direction: column; }
.mission-name { font-weight: 600; font-size: 14px; }
.mission-item.done .mission-name { text-decoration: line-through; color: var(--ink-3); }
.mission-meta { font-size: 12px; color: var(--ink-3); }

.form-inline { display: flex; gap: 10px; align-items: center; }
.form-inline input { flex: 1; }
.form-inline > .i svg { width: 16px; height: 16px; stroke: var(--ink-3); }

/* ================= gráficos ================= */
.chart { width: 100%; min-height: 60px; }
.chart-heat { padding: 6px 0; }
.chart svg { display: block; }
.heat-legend { display: flex; align-items: center; gap: 5px; margin-top: 10px; font-size: 11px; color: var(--ink-3); }
.heat-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

.chart-tip {
  position: fixed;
  z-index: 200;
  background: #22262d;
  border: 1px solid var(--border-strong);
  border-radius: 8px;
  box-shadow: var(--shadow);
  padding: 8px 11px;
  font-size: 12.5px;
  color: var(--ink-2);
  pointer-events: none;
  max-width: 260px;
  line-height: 1.45;
}
.chart-tip strong { color: var(--ink); }

.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-head { text-align: center; font-size: 10.5px; color: var(--ink-3); padding: 3px 0; letter-spacing: 1px; }
.cal-cell {
  aspect-ratio: 1;
  display: grid; place-items: center;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.cal-cell.cal-dark-ink { color: #14161a; }
.cal-cell.cal-today { outline: 1.5px solid var(--ink); outline-offset: 1px; }
.cal-cell.cal-future { color: var(--ink-3); border: 1px dashed var(--border-strong); }

.hbar-row { display: grid; grid-template-columns: minmax(120px, 220px) 1fr 44px; gap: 12px; align-items: center; padding: 7px 0; }
.hbar-label { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hbar-track { height: 10px; background: var(--surface-3); border-radius: 6px; overflow: hidden; }
.hbar-fill { display: block; height: 100%; border-radius: 6px; transition: width 0.6s ease; }
.hbar-val { font-size: 12.5px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }

.ring-value { transition: stroke-dashoffset 0.9s cubic-bezier(0.22, 1, 0.36, 1); }

/* ================= homem integral ================= */
.area-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 14px;
  margin-bottom: 18px;
}
.area-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 12px 14px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.area-name { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.area-name svg { width: 14px; height: 14px; stroke: var(--ink-3); }

/* ================= claudi ================= */
.claudi-head { display: flex; gap: 14px; align-items: center; margin-bottom: 20px; }
.claudi-avatar {
  width: 52px; height: 52px;
  border-radius: 14px;
  background: linear-gradient(150deg, #1c2b45, #16202f);
  border: 1px solid rgba(57, 135, 229, 0.4);
  display: grid; place-items: center;
}
.claudi-avatar svg { width: 24px; height: 24px; stroke: #6aa9f0; }
.claudi-head h2 { font-size: 20px; }
.claudi-head p { color: var(--ink-2); font-size: 13.5px; }
.claudi-list { display: flex; flex-direction: column; gap: 10px; }
.claudi-item {
  display: flex; gap: 13px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--ink-3);
  border-radius: var(--radius);
  padding: 14px 16px;
}
.claudi-item.tone-good { border-left-color: var(--good); }
.claudi-item.tone-warn { border-left-color: var(--accent-deep); }
.claudi-item.tone-bad { border-left-color: var(--bad); }
.claudi-item.tone-info { border-left-color: var(--info); }
.claudi-item-icon { display: inline-flex; margin-top: 2px; }
.claudi-item-icon svg { width: 17px; height: 17px; stroke: var(--ink-2); }
.claudi-item strong { font-size: 14px; }
.claudi-item p { font-size: 13px; color: var(--ink-2); margin-top: 2px; }
.claudi-foot { margin-top: 16px; font-size: 12px; color: var(--ink-3); }

/* ================= conquistas ================= */
.badge-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 13px;
}
.badge {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 15px;
  display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px;
}
.badge-icon { display: inline-flex; padding: 13px; border-radius: 50%; background: var(--surface-3); margin-bottom: 4px; }
.badge-icon svg { width: 21px; height: 21px; }
.badge.got { border-color: rgba(240, 180, 69, 0.35); }
.badge.got .badge-icon { background: var(--accent-dim); }
.badge.got .badge-icon svg { stroke: var(--accent); }
.badge.locked { opacity: 0.45; filter: grayscale(0.4); }
.badge strong { font-size: 13.5px; }
.badge p { font-size: 12px; color: var(--ink-3); flex: 1; }
.badge-date { font-size: 10.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--ink-3); }
.badge.got .badge-date { color: var(--accent); }

/* ================= formulários ================= */
input[type="text"], input[type="search"], textarea, select {
  background: var(--surface-2);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-sm);
  color: var(--ink);
  font-family: inherit;
  font-size: 13.5px;
  padding: 9px 12px;
  outline: none;
  transition: border-color 0.15s;
  width: 100%;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent-deep); }
textarea { resize: vertical; }
.field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 13px; }
.field span { font-size: 13px; font-weight: 600; color: var(--ink-2); }
.form-grid { display: flex; gap: 10px; flex-wrap: wrap; }
.form-grid select { width: auto; }
.form-grid input[type="text"] { flex: 1; min-width: 180px; }
.saved-hint { font-size: 12px; color: var(--ink-3); margin-left: 10px; }
.switch-row { display: flex; align-items: center; gap: 10px; font-size: 14px; margin-top: 12px; cursor: pointer; }
.switch-row input { width: auto; accent-color: var(--accent-deep); transform: scale(1.2); }

/* ================= diário ================= */
.journal-list { display: flex; flex-direction: column; gap: 12px; }
.journal-entry {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 15px 18px;
}
.journal-entry header { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 8px; text-transform: capitalize; }
.journal-entry p { font-size: 13.5px; color: var(--ink-2); margin-bottom: 5px; }
.journal-entry strong { color: var(--ink); font-size: 12.5px; display: block; }

/* ================= por que continuo ================= */
.why-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  gap: 13px;
}
.why-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
  display: flex; flex-direction: column;
}
.why-card img { width: 100%; height: 130px; object-fit: cover; }
.why-type {
  font-size: 10px; letter-spacing: 2px; text-transform: uppercase;
  color: var(--accent); font-weight: 700;
  padding: 12px 15px 0;
}
.why-card p { padding: 4px 15px 14px; font-size: 14px; flex: 1; }
.why-del { position: absolute; top: 8px; right: 8px; background: rgba(11, 12, 15, 0.6); opacity: 0; transition: opacity 0.15s; }
.why-card:hover .why-del { opacity: 1; }
.why-remind { display: flex; gap: 12px; align-items: center; background: var(--surface-2); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 10px; }
.why-remind img { width: 54px; height: 54px; border-radius: 8px; object-fit: cover; }
.why-remind p { font-size: 14.5px; font-weight: 600; }

/* ================= overlays ================= */
.overlay {
  position: fixed; inset: 0;
  z-index: 100;
  display: grid; place-items: center;
  padding: 20px;
}
.overlay[hidden] { display: none; }

.modal-overlay { background: rgba(5, 6, 8, 0.75); backdrop-filter: blur(6px); }
.modal {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-radius: 16px;
  box-shadow: var(--shadow);
  padding: 28px;
  max-width: 470px;
  width: 100%;
  max-height: 86dvh;
  overflow-y: auto;
  animation: modalIn 0.25s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes modalIn { from { opacity: 0; transform: translateY(14px) scale(0.98); } }
.modal-title { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 6px; }
.modal-sub { font-size: 13.5px; color: var(--ink-2); margin-bottom: 18px; }
.onboard-mark {
  width: 58px; height: 58px;
  display: grid; place-items: center;
  background: linear-gradient(145deg, var(--accent-deep), #8a5512);
  color: #0b0c0f; font-weight: 800; font-size: 24px;
  border-radius: 14px;
  margin-bottom: 16px;
}
.help-grid { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; margin-bottom: 20px; font-size: 13.5px; color: var(--ink-2); }

/* ---- modo guerra ---- */
.war-overlay { background: #050608; }
.war { text-align: center; max-width: 640px; width: 100%; position: relative; padding: 20px; }
.war-kicker { font-size: 12px; letter-spacing: 5px; color: var(--accent); font-weight: 700; margin-bottom: 18px; }
.war-title { font-size: clamp(28px, 5vw, 46px); font-weight: 800; letter-spacing: -1px; margin-bottom: 8px; }
.war-goal { color: var(--ink-2); font-size: 15px; margin-bottom: 30px; }
.war-clock {
  font-size: clamp(64px, 14vw, 120px);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -3px;
  line-height: 1;
  margin-bottom: 30px;
  text-shadow: 0 0 60px rgba(240, 180, 69, 0.18);
}
.war-controls { justify-content: center; margin-bottom: 26px; }
.war-next { color: var(--ink-3); font-size: 14px; }
.war-next strong { color: var(--ink-2); }
.war-exit { position: fixed; top: 18px; right: 18px; background: none; border: 1px solid var(--border-strong); border-radius: 50%; padding: 10px; color: var(--ink-3); cursor: pointer; }
.war-exit:hover { color: var(--ink); border-color: var(--ink-3); }
.war-exit svg { width: 16px; height: 16px; display: block; }

/* ---- celebração ---- */
.celebrate-overlay { background: rgba(5, 6, 8, 0.88); backdrop-filter: blur(8px); }
.celebrate { text-align: center; position: relative; z-index: 2; animation: modalIn 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
.celebrate-ring {
  width: 96px; height: 96px;
  margin: 0 auto 24px;
  border-radius: 50%;
  border: 3px solid var(--good);
  display: grid; place-items: center;
  box-shadow: 0 0 50px rgba(25, 158, 112, 0.35), inset 0 0 24px rgba(25, 158, 112, 0.12);
  animation: ringPulse 1.6s ease infinite;
}
.celebrate-ring svg { width: 44px; height: 44px; stroke: var(--good-text); }
@keyframes ringPulse {
  0%, 100% { box-shadow: 0 0 40px rgba(25, 158, 112, 0.3), inset 0 0 20px rgba(25, 158, 112, 0.1); }
  50% { box-shadow: 0 0 70px rgba(25, 158, 112, 0.5), inset 0 0 30px rgba(25, 158, 112, 0.2); }
}
.celebrate h1 { font-size: clamp(30px, 6vw, 48px); font-weight: 800; letter-spacing: 4px; }
.celebrate p { color: var(--ink-2); font-size: 17px; margin: 8px 0 26px; }
.rank-name { font-size: 24px; color: var(--accent); font-weight: 800; letter-spacing: 2px; margin-bottom: 26px; }
.confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.confetti i {
  position: absolute;
  top: -12px;
  left: calc(4% + var(--i) * 4%);
  width: 7px; height: 11px;
  background: var(--accent);
  opacity: 0.85;
  border-radius: 2px;
  animation: confettiFall 2.8s linear infinite;
  animation-delay: calc(var(--i) * 0.17s);
}
.confetti i:nth-child(3n) { background: var(--good-text); width: 5px; height: 9px; }
.confetti i:nth-child(4n) { background: #e8e6df; }
@keyframes confettiFall {
  0% { transform: translateY(-20px) rotate(0deg); opacity: 0; }
  8% { opacity: 0.9; }
  100% { transform: translateY(105vh) rotate(560deg); opacity: 0.5; }
}

/* ================= toasts ================= */
.toasts {
  position: fixed;
  bottom: 22px; right: 22px;
  display: flex; flex-direction: column; gap: 9px;
  z-index: 150;
  max-width: min(360px, calc(100vw - 44px));
}
.toast {
  display: flex; align-items: center; gap: 9px;
  background: #22262d;
  border: 1px solid var(--border-strong);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 11px 15px;
  font-size: 13.5px;
  transform: translateX(30px);
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
}
.toast.show { transform: none; opacity: 1; }
.toast svg { width: 16px; height: 16px; flex-shrink: 0; }
.toast.good { border-color: rgba(25, 158, 112, 0.45); }
.toast.good svg { stroke: var(--good-text); }
.toast.bad { border-color: rgba(229, 72, 77, 0.5); }
.toast.bad svg { stroke: var(--bad-text); }
.toast.warn svg { stroke: var(--accent); }
.toast.info svg { stroke: var(--info); }

/* ================= impressão (relatório PDF) ================= */
#print-report { display: none; }
@media print {
  body > *:not(#print-report) { display: none !important; }
  body { background: #fff; color: #111; }
  #print-report { display: block; padding: 24px; font-family: var(--font); }
  #print-report h1 { font-size: 22px; margin-bottom: 4px; }
  #print-report h2 { font-size: 15px; margin: 18px 0 8px; }
  #print-report p { font-size: 12px; color: #444; }
  #print-report table { width: 100%; border-collapse: collapse; margin-top: 6px; }
  #print-report td { border: 1px solid #ddd; padding: 7px 10px; font-size: 12px; }
}

/* ================= responsivo ================= */
@media (max-width: 900px) {
  .grid-2 { grid-template-columns: 1fr; }
  .sidebar {
    position: fixed;
    left: 0; top: 0;
    transform: translateX(-100%);
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: var(--shadow);
  }
  body.sidebar-open .sidebar { transform: none; }
  body.sidebar-open .sidebar-scrim {
    display: block;
    position: fixed; inset: 0;
    background: rgba(5, 6, 8, 0.6);
    z-index: 35;
  }
  .menu-btn { display: inline-flex; }
  .view { padding: 20px 16px 70px; }
  .topbar { padding: 10px 16px; }
  .mission-bar-pct { font-size: 26px; }
  .tl-time { width: 44px; }
  .tl-item:not(:last-child)::before { left: 66px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

</style>

/* Sorteio anti-repetição: evita as últimas N frases exibidas */
P66.pickQuote = function (recentIdx) {
  const total = P66.QUOTES.length;
  const recent = new Set(recentIdx || []);
  let idx, guard = 0;
  do {
    idx = Math.floor(Math.random() * total);
    guard++;
  } while (recent.has(idx) && guard < 200);
  return idx;
};

<script>
/* =============================================================
   PROJETO 66 — Sons de vitória (Web Audio, sem assets externos)
   Sfx.init() precisa ser chamado após o primeiro gesto do usuário.
   ============================================================= */
'use strict';

P66.Sfx = {
  ctx: null,
  enabled: true,

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (AC) this.ctx = new AC();
  },

  _tone(freq, t0, dur, type = 'sine', gain = 0.12) {
    const ctx = this.ctx;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(gain, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  },

  _play(notes, type = 'sine', gain = 0.12) {
    if (!this.enabled) return;
    this.init();
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    notes.forEach(([f, at, dur]) => this._tone(f, now + at, dur, type, gain));
  },

  /* hábito concluído — dois toques secos e limpos */
  win()     { this._play([[660, 0, 0.10], [990, 0.09, 0.22]], 'triangle', 0.14); },
  /* missão extra concluída */
  mission() { this._play([[520, 0, 0.09], [780, 0.08, 0.16]], 'triangle', 0.11); },
  /* dia 100% — pequena fanfarra */
  fanfare() { this._play([[523, 0, 0.14], [659, 0.12, 0.14], [784, 0.24, 0.14], [1047, 0.38, 0.42]], 'triangle', 0.15); },
  /* subiu de nível */
  levelUp() { this._play([[392, 0, 0.12], [523, 0.11, 0.12], [659, 0.22, 0.12], [784, 0.33, 0.3], [1047, 0.46, 0.5]], 'triangle', 0.16); },
  /* conquista desbloqueada */
  badge()   { this._play([[880, 0, 0.1], [1174, 0.1, 0.3]], 'sine', 0.12); },
  /* desfazer / neutro */
  tick()    { this._play([[440, 0, 0.06]], 'sine', 0.07); },
};

<script>
/* =============================================================
   PROJETO 66 — Store: estado, persistência (localStorage) e
   todas as estatísticas derivadas (streaks, XP, áreas, séries).
   ============================================================= */
'use strict';

P66.Store = {
  KEY: 'p66_state_v1',
  state: null,

  /* ---------- ciclo de vida ---------- */
  init() {
    try {
      const raw = localStorage.getItem(this.KEY);
      this.state = raw ? JSON.parse(raw) : null;
    } catch (e) { this.state = null; }
    if (!this.state || this.state.version !== 1) this.state = this._defaultState();
    this._ensureDay(this.today());
    this.save();
  },

  _defaultState() {
    return {
      version: 1,
      profile: { name: 'Renan', cycleStart: this.today() },
      settings: { sound: true, onboarded: false },
      habits: JSON.parse(JSON.stringify(P66.DEFAULT_HABITS)),
      log: {},            // 'YYYY-MM-DD' -> { total, habits:{id:iso}, missions:{id:iso}, extraMissions:[{id,name,xp}] }
      failures: {},       // 'YYYY-MM-DD' -> { motivo, plano }
      journal: {},        // 'YYYY-MM-DD' -> { bem, falha, melhorar, vitoria, deus, ts }
      whys: [],           // [{id, type, text, img?, createdAt}]
      achievements: {},   // id -> dateKey
      xp: 0,
      recentQuotes: [],
      warSessions: [],    // [{date, seconds}]
    };
  },

  save() {
    try { localStorage.setItem(this.KEY, JSON.stringify(this.state)); }
    catch (e) { console.warn('P66: falha ao salvar', e); }
  },

  _emit() {
    this.save();
    document.dispatchEvent(new CustomEvent('p66:change'));
  },

  /* ---------- datas ---------- */
  dkey(d) {
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  },
  today() { return this.dkey(new Date()); },
  parseKey(k) {
    const [y, m, d] = k.split('-').map(Number);
    return new Date(y, m - 1, d);
  },
  addDays(k, n) {
    const d = this.parseKey(k);
    d.setDate(d.getDate() + n);
    return this.dkey(d);
  },
  diffDays(a, b) { return Math.round((this.parseKey(b) - this.parseKey(a)) / 864e5); },
  weekdayShort(k) { return ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'][this.parseKey(k).getDay()]; },
  fmtDate(k) {
    const d = this.parseKey(k);
    return d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'short' });
  },
  fmtDateLong(k) {
    const d = this.parseKey(k);
    return d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  },

  /* ---------- ciclo de 66 dias ---------- */
  cycleStart() { return this.state.profile.cycleStart; },
  _elapsed() { return Math.max(0, this.diffDays(this.cycleStart(), this.today())); },
  cycleNumber() { return Math.floor(this._elapsed() / P66.CYCLE_DAYS) + 1; },
  dayNumber() { return (this._elapsed() % P66.CYCLE_DAYS) + 1; },
  daysLeft() { return P66.CYCLE_DAYS - this.dayNumber(); },
  currentCycleStartKey() {
    return this.addDays(this.cycleStart(), (this.cycleNumber() - 1) * P66.CYCLE_DAYS);
  },
  restartCycle() {
    this.state.profile.cycleStart = this.today();
    this._emit();
  },

  /* ---------- dia / hábitos ---------- */
  habits() { return this.state.habits.filter(h => h.active !== false); },
  habitById(id) { return this.state.habits.find(h => h.id === id); },

  _ensureDay(k) {
    if (!this.state.log[k]) {
      this.state.log[k] = { total: this.habits().length, habits: {}, missions: {}, extraMissions: [] };
    }
    return this.state.log[k];
  },
  day(k) { return this.state.log[k] || null; },

  isDone(id, k) {
    const e = this.day(k || this.today());
    return !!(e && e.habits[id]);
  },
  doneAt(id, k) {
    const e = this.day(k || this.today());
    return e ? e.habits[id] || null : null;
  },

  completeHabit(id) {
    const k = this.today();
    const e = this._ensureDay(k);
    if (e.habits[id]) return null;
    const h = this.habitById(id);
    if (!h) return null;
    e.habits[id] = new Date().toISOString();
    this.state.xp += h.xp;
    const before = this.levelInfo(this.state.xp - h.xp).level;
    const after = this.levelInfo().level;
    const unlocked = this.checkAchievements();
    const c = this.completionForDay(k);
    this._emit();
    return { xp: h.xp, pct: c.pct, dayComplete: c.pct === 100, levelUp: after > before ? this.levelInfo() : null, unlocked };
  },

  undoHabit(id) {
    const k = this.today();
    const e = this.day(k);
    if (!e || !e.habits[id]) return;
    delete e.habits[id];
    const h = this.habitById(id);
    if (h) this.state.xp = Math.max(0, this.state.xp - h.xp);
    this._emit();
  },

  completionForDay(k) {
    const e = this.day(k);
    const total = e ? (e.total || this.habits().length) : this.habits().length;
    const done = e ? Object.keys(e.habits).length : 0;
    return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
  },

  isPerfect(k) {
    const c = this.completionForDay(k);
    return c.total > 0 && c.done >= c.total;
  },

  /* hábitos de hoje cujo horário já passou e não foram concluídos */
  lateHabitsToday() {
    const now = new Date();
    const cur = now.getHours() * 60 + now.getMinutes();
    return this.habits().filter(h => {
      if (this.isDone(h.id)) return false;
      const [hh, mm] = h.time.split(':').map(Number);
      return hh * 60 + mm < cur;
    });
  },

  nextHabit() {
    const pending = this.habits().filter(h => !this.isDone(h.id))
      .sort((a, b) => a.time.localeCompare(b.time));
    const now = new Date();
    const cur = now.getHours() * 60 + now.getMinutes();
    const upcoming = pending.find(h => {
      const [hh, mm] = h.time.split(':').map(Number);
      return hh * 60 + mm >= cur;
    });
    return upcoming || pending[0] || null;
  },

  /* ---------- missões ---------- */
  _hash(s) {
    let h = 2166136261;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    return h >>> 0;
  },
  _dailyMissionPool(k) {
    const pool = [...P66.MISSIONS];
    let seed = this._hash('p66' + k);
    const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
    for (let i = pool.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [pool[i], pool[j]] = [pool[j], pool[i]];
    }
    return pool.slice(0, P66.MISSIONS_PER_DAY);
  },
  missionsForDay(k) {
    k = k || this.today();
    const e = this.day(k);
    return this._dailyMissionPool(k).concat((e && e.extraMissions) || []);
  },
  missionDone(id, k) {
    const e = this.day(k || this.today());
    return !!(e && e.missions[id]);
  },
  completeMission(id) {
    const k = this.today();
    const e = this._ensureDay(k);
    if (e.missions[id]) return null;
    const m = this.missionsForDay(k).find(x => x.id === id);
    if (!m) return null;
    e.missions[id] = new Date().toISOString();
    this.state.xp += m.xp;
    const before = this.levelInfo(this.state.xp - m.xp).level;
    const after = this.levelInfo().level;
    const unlocked = this.checkAchievements();
    this._emit();
    return { xp: m.xp, levelUp: after > before ? this.levelInfo() : null, unlocked };
  },
  undoMission(id) {
    const k = this.today();
    const e = this.day(k);
    if (!e || !e.missions[id]) return;
    const m = this.missionsForDay(k).find(x => x.id === id);
    delete e.missions[id];
    if (m) this.state.xp = Math.max(0, this.state.xp - m.xp);
    this._emit();
  },
  addCustomMission(name, xp) {
    const e = this._ensureDay(this.today());
    e.extraMissions.push({ id: 'mx_' + Date.now(), name, xp: xp || 40, icon: 'flag', areas: [] });
    this._emit();
  },

  /* ---------- streaks & contadores ---------- */
  currentStreak() {
    let k = this.today();
    let n = 0;
    if (this.isPerfect(k)) { n = 1; }
    k = this.addDays(k, -1);
    while (this.day(k) && this.isPerfect(k)) { n++; k = this.addDays(k, -1); }
    return n;
  },
  bestStreak() {
    const keys = Object.keys(this.state.log).sort();
    let best = 0, run = 0, prev = null;
    for (const k of keys) {
      if (this.isPerfect(k)) {
        run = (prev && this.diffDays(prev, k) === 1) ? run + 1 : 1;
        prev = k;
        if (run > best) best = run;
      } else { run = 0; prev = null; }
    }
    return best;
  },
  perfectDays() {
    return Object.keys(this.state.log).filter(k => this.isPerfect(k)).length;
  },
  brokenDays() {
    // dias já encerrados do ciclo atual com menos de 100%
    const start = this.currentCycleStartKey();
    const today = this.today();
    let n = 0;
    for (let k = start; k < today; k = this.addDays(k, 1)) {
      if (!this.isPerfect(k)) n++;
    }
    return n;
  },
  totalCompletions() {
    return Object.values(this.state.log).reduce((s, e) => s + Object.keys(e.habits).length, 0);
  },
  habitCount(id) {
    return Object.values(this.state.log).reduce((s, e) => s + (e.habits[id] ? 1 : 0), 0);
  },
  missionsCount() {
    return Object.values(this.state.log).reduce((s, e) => s + Object.keys(e.missions).length, 0);
  },
  journalCount() { return Object.keys(this.state.journal).length; },
  flawlessCycle() {
    return this.dayNumber() === P66.CYCLE_DAYS && this.brokenDays() === 0 && this.isPerfect(this.today());
  },
  overallRate() {
    const start = this.currentCycleStartKey();
    const today = this.today();
    let done = 0, total = 0;
    for (let k = start; k <= today; k = this.addDays(k, 1)) {
      const c = this.completionForDay(k);
      done += c.done; total += c.total;
    }
    return total ? Math.round((done / total) * 100) : 0;
  },
  lastFailure() {
    let k = this.addDays(this.today(), -1);
    const start = this.cycleStart();
    while (k >= start) {
      if (this.day(k) && !this.isPerfect(k)) {
        const e = this.day(k);
        const missed = this.habits().filter(h => !e.habits[h.id]).map(h => h.name);
        return { key: k, missed, note: this.state.failures[k] || null };
      }
      k = this.addDays(k, -1);
    }
    return null;
  },
  setFailureNote(k, motivo, plano) {
    this.state.failures[k] = { motivo, plano };
    this._emit();
  },

  /* ---------- séries para gráficos ---------- */
  firstLogKey() {
    return Object.keys(this.state.log).sort()[0] || this.today();
  },
  weeklySeries() {
    // não plota dias anteriores ao primeiro registro (0% falso)
    const first = this.firstLogKey();
    const out = [];
    for (let i = 6; i >= 0; i--) {
      const k = this.addDays(this.today(), -i);
      if (k < first) continue;
      const c = this.completionForDay(k);
      out.push({ key: k, label: this.weekdayShort(k), ...c });
    }
    return out;
  },
  monthlySeries(days = 30) {
    const first = this.firstLogKey();
    const out = [];
    for (let i = days - 1; i >= 0; i--) {
      const k = this.addDays(this.today(), -i);
      if (k < first) continue;
      const c = this.completionForDay(k);
      out.push({ key: k, label: this.fmtDate(k), ...c });
    }
    return out;
  },
  heatmapCycle() {
    const start = this.currentCycleStartKey();
    const today = this.today();
    const cells = [];
    for (let i = 0; i < P66.CYCLE_DAYS; i++) {
      const k = this.addDays(start, i);
      const c = this.completionForDay(k);
      cells.push({
        key: k, dayNum: i + 1, pct: c.pct,
        state: k > today ? 'future' : (k === today ? 'today' : 'past'),
      });
    }
    return cells;
  },
  hourHistogram() {
    const hours = new Array(24).fill(0);
    Object.values(this.state.log).forEach(e => {
      Object.values(e.habits).forEach(iso => {
        const d = new Date(iso);
        if (!isNaN(d)) hours[d.getHours()]++;
      });
    });
    return hours;
  },
  habitStrength() {
    const start = this.currentCycleStartKey();
    const today = this.today();
    const opp = this.diffDays(start, today) + 1;
    return this.habits().map(h => {
      let done = 0, lateSum = 0, lateN = 0;
      for (let k = start; k <= today; k = this.addDays(k, 1)) {
        const iso = this.doneAt(h.id, k);
        if (iso) {
          done++;
          const d = new Date(iso);
          const [hh, mm] = h.time.split(':').map(Number);
          const delta = (d.getHours() * 60 + d.getMinutes()) - (hh * 60 + mm);
          if (!isNaN(delta)) { lateSum += delta; lateN++; }
        }
      }
      return { habit: h, done, opp, rate: opp ? Math.round((done / opp) * 100) : 0, avgDelay: lateN ? Math.round(lateSum / lateN) : 0 };
    }).sort((a, b) => b.rate - a.rate);
  },
  weekdayRates() {
    // taxa média de conclusão por dia da semana (histórico todo)
    const sums = new Array(7).fill(0), counts = new Array(7).fill(0);
    Object.keys(this.state.log).forEach(k => {
      if (k > this.today()) return;
      const wd = this.parseKey(k).getDay();
      sums[wd] += this.completionForDay(k).pct;
      counts[wd]++;
    });
    return ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'].map((label, i) => ({
      label, pct: counts[i] ? Math.round(sums[i] / counts[i]) : 0, n: counts[i],
    }));
  },
  minutesInvested() {
    let min = 0;
    Object.values(this.state.log).forEach(e => {
      Object.keys(e.habits).forEach(id => {
        const h = this.habitById(id);
        if (h) min += h.min;
      });
    });
    return min;
  },
  rateBetween(fromKey, toKey) {
    let done = 0, total = 0;
    for (let k = fromKey; k <= toKey; k = this.addDays(k, 1)) {
      if (!this.day(k)) continue;
      const c = this.completionForDay(k);
      done += c.done; total += c.total;
    }
    return total ? Math.round((done / total) * 100) : null;
  },

  /* ---------- Homem Integral (0–100 por área) ---------- */
  areaScores(windowDays = 14) {
    const scores = {};
    const from = this.addDays(this.today(), -(windowDays - 1));
    Object.keys(P66.AREAS).forEach(a => { scores[a] = { done: 0, opp: 0, missions: 0 }; });
    for (let k = from; k <= this.today(); k = this.addDays(k, 1)) {
      const e = this.day(k);
      this.habits().forEach(h => {
        h.areas.forEach(a => {
          if (!scores[a]) return;
          scores[a].opp++;
          if (e && e.habits[h.id]) scores[a].done++;
        });
      });
      if (e) {
        this.missionsForDay(k).forEach(m => {
          if (e.missions[m.id]) m.areas.forEach(a => { if (scores[a]) scores[a].missions++; });
        });
      }
    }
    return Object.keys(P66.AREAS).map(a => {
      const s = scores[a];
      const base = s.opp ? (s.done / s.opp) * 100 : 0;
      const bonus = Math.min(18, s.missions * 3);
      return { area: a, ...P66.AREAS[a], score: Math.min(100, Math.round(s.opp ? base * 0.9 + bonus : Math.min(100, s.missions * 12))) };
    });
  },

  /* ---------- XP / patentes ---------- */
  levelInfo(xp) {
    const total = xp === undefined ? this.state.xp : xp;
    let cur = P66.RANKS[0], next = null;
    for (const r of P66.RANKS) {
      if (total >= r.xp) cur = r; else { next = r; break; }
    }
    const span = next ? next.xp - cur.xp : 1;
    const into = next ? total - cur.xp : 1;
    return { level: cur.level, name: cur.name, xp: total, next, pct: next ? Math.min(100, Math.round((into / span) * 100)) : 100 };
  },

  /* ---------- conquistas ---------- */
  checkAchievements() {
    const fresh = [];
    P66.ACHIEVEMENTS.forEach(a => {
      if (!this.state.achievements[a.id] && a.check(this)) {
        this.state.achievements[a.id] = this.today();
        fresh.push(a);
      }
    });
    return fresh;
  },

  /* ---------- reflexão / diário ---------- */
  saveJournal(k, entry) {
    this.state.journal[k] = { ...entry, ts: new Date().toISOString() };
    this.checkAchievements();
    this._emit();
  },
  searchJournal(q) {
    const term = (q || '').toLowerCase().trim();
    return Object.keys(this.state.journal).sort().reverse()
      .map(k => ({ key: k, ...this.state.journal[k] }))
      .filter(e => !term || ['bem', 'falha', 'melhorar', 'vitoria', 'deus']
        .some(f => (e[f] || '').toLowerCase().includes(term)));
  },

  /* ---------- "Por que continuo?" ---------- */
  addWhy(type, text, img) {
    this.state.whys.push({ id: 'w_' + Date.now(), type, text, img: img || null, createdAt: this.today() });
    this._emit();
  },
  removeWhy(id) {
    this.state.whys = this.state.whys.filter(w => w.id !== id);
    this._emit();
  },

  /* ---------- frases ---------- */
  nextQuote() {
    const idx = P66.pickQuote(this.state.recentQuotes);
    this.state.recentQuotes.push(idx);
    if (this.state.recentQuotes.length > 40) this.state.recentQuotes.shift();
    this.save();
    return P66.QUOTES[idx];
  },

  /* ---------- backup ---------- */
  exportJSON() { return JSON.stringify(this.state, null, 2); },
  importJSON(text) {
    const obj = JSON.parse(text);
    if (!obj || obj.version !== 1 || !obj.profile || !obj.log) throw new Error('Arquivo de backup inválido.');
    this.state = obj;
    this._ensureDay(this.today());
    this._emit();
  },
  resetAll() {
    this.state = this._defaultState();
    this.state.settings.onboarded = true;
    this._emit();
  },

  /* ---------- dados de demonstração (16 dias -> hoje é o Dia 17) ---------- */
  seedDemo() {
    const s = this._defaultState();
    s.settings.onboarded = true;
    s.profile.name = this.state.profile.name || 'Renan';
    s.profile.cycleStart = this.addDays(this.today(), -16);
    let seed = this._hash('demo' + s.profile.cycleStart);
    const rnd = () => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed / 4294967296; };
    // perfil de cada dia: maioria forte, 3 dias quebrados (2, 9 e 13)
    const brokenAt = new Set([2, 9, 13]);
    for (let i = 0; i < 16; i++) {
      const k = this.addDays(s.profile.cycleStart, i);
      const e = { total: s.habits.length, habits: {}, missions: {}, extraMissions: [] };
      const missCount = brokenAt.has(i) ? 2 + Math.floor(rnd() * 3) : 0;
      const missIdx = new Set();
      while (missIdx.size < missCount) missIdx.add(Math.floor(rnd() * s.habits.length));
      s.habits.forEach((h, hi) => {
        if (missIdx.has(hi)) return;
        const [hh, mm] = h.time.split(':').map(Number);
        const delay = Math.floor(rnd() * 50) - 10; // -10..+40 min do horário planejado
        const d = this.parseKey(k);
        d.setHours(hh, mm + Math.max(-15, delay), Math.floor(rnd() * 60));
        e.habits[h.id] = d.toISOString();
        s.xp += h.xp;
      });
      // 1 a 3 missões por dia
      const mN = 1 + Math.floor(rnd() * 3);
      this._dailyMissionPool(k).slice(0, mN).forEach(m => {
        const d = this.parseKey(k); d.setHours(12 + Math.floor(rnd() * 9), Math.floor(rnd() * 60));
        e.missions[m.id] = d.toISOString();
        s.xp += m.xp;
      });
      s.log[k] = e;
    }
    s.failures[this.addDays(s.profile.cycleStart, 9)] = { motivo: 'Dormi tarde na véspera e o dia começou atrasado.', plano: 'Protocolo do sono às 21h30 sem exceção; celular fora do quarto.' };
    s.failures[this.addDays(s.profile.cycleStart, 13)] = { motivo: 'Compromisso imprevisto à noite engoliu o planejamento.', plano: 'Antecipar leitura e planejamento para a hora do almoço quando houver agenda à noite.' };
    const j = (k, o) => { s.journal[k] = { ...o, ts: this.parseKey(k).toISOString() }; };
    j(this.addDays(s.profile.cycleStart, 14), { bem: 'Treino completo e devocional sem pressa.', falha: 'Peguei o celular antes do devocional.', melhorar: 'Deixar a Bíblia aberta na mesa na véspera.', vitoria: 'Terminei a proposta do cliente antes do prazo.', deus: 'Paciência se treina nas filas e nos imprevistos.' },
    );
    j(this.addDays(s.profile.cycleStart, 15), { bem: 'Dia 100% e ainda liguei para meus pais.', falha: 'Quase pulei a pausa da tarde.', melhorar: 'Alarme silencioso às 15h para a pausa.', vitoria: 'Minha esposa comentou que me viu mais presente.', deus: 'Constância vale mais que intensidade.' },
    );
    s.recentQuotes = this.state.recentQuotes || [];
    this.state = s;
    this._ensureDay(this.today());
    this.checkAchievements();
    this._emit();
  },
};

</script>
<script>
/* =============================================================
   PROJETO 66 — Gráficos SVG (sem bibliotecas)
   Marcas finas, extremidades arredondadas ancoradas na base,
   grid recessivo, tooltip em hover. Paleta validada em P66.VIZ.
   ============================================================= */
'use strict';

P66.Charts = (() => {
  const V = P66.VIZ;
  const NS = 'http://www.w3.org/2000/svg';

  /* ---------- tooltip singleton ---------- */
  const tip = () => document.getElementById('chart-tip');
  function showTip(evt, html) {
    const t = tip();
    if (!t) return;
    t.innerHTML = html;
    t.hidden = false;
    const pad = 14;
    let x = evt.clientX + pad, y = evt.clientY + pad;
    const r = t.getBoundingClientRect();
    if (x + r.width > window.innerWidth - 8) x = evt.clientX - r.width - pad;
    if (y + r.height > window.innerHeight - 8) y = evt.clientY - r.height - pad;
    t.style.left = x + 'px';
    t.style.top = y + 'px';
  }
  function hideTip() { const t = tip(); if (t) t.hidden = true; }

  function svgEl(tag, attrs) {
    const el = document.createElementNS(NS, tag);
    for (const k in attrs) el.setAttribute(k, attrs[k]);
    return el;
  }

  /* barra com topo arredondado ancorada na base */
  function barPath(x, y, w, h, r) {
    r = Math.min(r, w / 2, h);
    if (h <= 0) return '';
    return `M${x},${y + h} L${x},${y + r} Q${x},${y} ${x + r},${y} L${x + w - r},${y} Q${x + w},${y} ${x + w},${y + r} L${x + w},${y + h} Z`;
  }

  /* ---------- barras verticais (% por dia) ---------- */
  function bars(el, data, opts = {}) {
    el.innerHTML = '';
    const W = el.clientWidth || 320, H = opts.height || 180;
    const padL = 30, padB = 22, padT = 10, padR = 6;
    const iw = W - padL - padR, ih = H - padT - padB;
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', height: H, role: 'img' });
    const max = opts.max || 100;

    [0, 50, 100].forEach(v => {
      const y = padT + ih - (v / max) * ih;
      svg.appendChild(svgEl('line', { x1: padL, y1: y, x2: W - padR, y2: y, stroke: v === 0 ? 'rgba(255,255,255,0.14)' : V.grid, 'stroke-width': 1 }));
      const lab = svgEl('text', { x: padL - 7, y: y + 3.5, 'text-anchor': 'end', fill: V.ink3, 'font-size': 10 });
      lab.textContent = v;
      svg.appendChild(lab);
    });

    const n = data.length;
    const slot = iw / n;
    const bw = Math.min(26, Math.max(6, slot - 4));
    data.forEach((d, i) => {
      const val = Math.max(0, Math.min(max, d.pct ?? d.value ?? 0));
      const h = (val / max) * ih;
      const x = padL + i * slot + (slot - bw) / 2;
      const y = padT + ih - h;
      const isToday = d.key === P66.Store.today();
      const p = svgEl('path', {
        d: barPath(x, y, bw, h, 4),
        fill: isToday ? V.heat[3] : V.series[0],
        opacity: d.future ? 0.25 : 1,
      });
      // alvo de hover maior que a marca
      const hit = svgEl('rect', { x: padL + i * slot, y: padT, width: slot, height: ih, fill: 'transparent' });
      hit.addEventListener('mousemove', e => showTip(e, `<strong>${d.label}</strong><br>${d.done !== undefined ? `${d.done}/${d.total} hábitos · ` : ''}${val}%`));
      hit.addEventListener('mouseleave', hideTip);
      svg.appendChild(p);
      if (h > 0 || true) svg.appendChild(hit);
      if (n <= 12 || i % Math.ceil(n / 10) === 0) {
        const lab = svgEl('text', { x: padL + i * slot + slot / 2, y: H - 6, 'text-anchor': 'middle', fill: isToday ? V.ink2 : V.ink3, 'font-size': 10 });
        lab.textContent = d.label;
        svg.appendChild(lab);
      }
    });
    el.appendChild(svg);
  }

  /* ---------- linha com área (evolução) ---------- */
  function line(el, data, opts = {}) {
    el.innerHTML = '';
    const W = el.clientWidth || 320, H = opts.height || 200;
    const padL = 30, padB = 22, padT = 10, padR = 10;
    const iw = W - padL - padR, ih = H - padT - padB;
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', height: H, role: 'img' });
    const max = opts.max || 100;
    const n = data.length;
    const X = i => padL + (n === 1 ? iw / 2 : (i / (n - 1)) * iw);
    const Y = v => padT + ih - (Math.max(0, Math.min(max, v)) / max) * ih;

    [0, 50, 100].forEach(v => {
      const y = Y(v);
      svg.appendChild(svgEl('line', { x1: padL, y1: y, x2: W - padR, y2: y, stroke: v === 0 ? 'rgba(255,255,255,0.14)' : V.grid, 'stroke-width': 1 }));
      const lab = svgEl('text', { x: padL - 7, y: y + 3.5, 'text-anchor': 'end', fill: V.ink3, 'font-size': 10 });
      lab.textContent = v;
      svg.appendChild(lab);
    });

    const pts = data.map((d, i) => [X(i), Y(d.pct ?? d.value ?? 0)]);
    const lineD = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
    const areaD = lineD + ` L${pts[pts.length - 1][0]},${padT + ih} L${pts[0][0]},${padT + ih} Z`;

    const gid = 'g' + Math.random().toString(36).slice(2, 8);
    const defs = svgEl('defs', {});
    defs.innerHTML = `<linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="${V.series[0]}" stop-opacity="0.30"/>
      <stop offset="1" stop-color="${V.series[0]}" stop-opacity="0"/></linearGradient>`;
    svg.appendChild(defs);
    svg.appendChild(svgEl('path', { d: areaD, fill: `url(#${gid})` }));
    svg.appendChild(svgEl('path', { d: lineD, fill: 'none', stroke: V.series[0], 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));

    // rótulos esparsos no eixo X (sem colidir com o último)
    const step = Math.max(1, Math.ceil(n / 6));
    data.forEach((d, i) => {
      if (i % step !== 0 && i !== n - 1) return;
      if (i !== n - 1 && n - 1 - i < step * 0.6) return;
      const lab = svgEl('text', { x: X(i), y: H - 6, 'text-anchor': 'middle', fill: V.ink3, 'font-size': 10 });
      lab.textContent = d.label;
      svg.appendChild(lab);
    });

    // crosshair + tooltip
    const cursor = svgEl('line', { x1: 0, y1: padT, x2: 0, y2: padT + ih, stroke: 'rgba(255,255,255,0.25)', 'stroke-width': 1, visibility: 'hidden' });
    const dot = svgEl('circle', { r: 4, fill: V.heat[3], stroke: V.surface, 'stroke-width': 2, visibility: 'hidden' });
    svg.appendChild(cursor); svg.appendChild(dot);
    const hit = svgEl('rect', { x: padL, y: padT, width: iw, height: ih, fill: 'transparent' });
    hit.addEventListener('mousemove', e => {
      const box = svg.getBoundingClientRect();
      const mx = (e.clientX - box.left) * (W / box.width);
      let i = Math.round(((mx - padL) / iw) * (n - 1));
      i = Math.max(0, Math.min(n - 1, i));
      cursor.setAttribute('x1', X(i)); cursor.setAttribute('x2', X(i));
      cursor.setAttribute('visibility', 'visible');
      dot.setAttribute('cx', X(i)); dot.setAttribute('cy', Y(data[i].pct ?? data[i].value ?? 0));
      dot.setAttribute('visibility', 'visible');
      const d = data[i];
      showTip(e, `<strong>${d.label}</strong><br>${d.done !== undefined ? `${d.done}/${d.total} hábitos · ` : ''}${d.pct ?? d.value ?? 0}%`);
    });
    hit.addEventListener('mouseleave', () => { cursor.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); hideTip(); });
    svg.appendChild(hit);
    el.appendChild(svg);
  }

  /* ---------- heatmap dos 66 dias ---------- */
  function heatColor(pct) {
    if (pct <= 0) return V.heatZero;
    if (pct < 34) return V.heat[0];
    if (pct < 67) return V.heat[1];
    if (pct < 100) return V.heat[2];
    return V.heat[3];
  }
  function heatmap(el, cells, opts = {}) {
    el.innerHTML = '';
    const cols = opts.cols || 11; // 11 x 6 = 66
    const size = 15, gap = 3;
    const rows = Math.ceil(cells.length / cols);
    const W = cols * (size + gap) - gap, H = rows * (size + gap) - gap;
    const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, width: '100%', style: 'max-width:' + (W * 1.6) + 'px', role: 'img' });
    cells.forEach((c, i) => {
      const x = (i % cols) * (size + gap), y = Math.floor(i / cols) * (size + gap);
      const attrs = { x, y, width: size, height: size, rx: 3.5 };
      if (c.state === 'future') {
        Object.assign(attrs, { fill: 'transparent', stroke: 'rgba(255,255,255,0.07)', 'stroke-width': 1 });
      } else {
        Object.assign(attrs, { fill: heatColor(c.pct) });
        if (c.state === 'today') Object.assign(attrs, { stroke: V.ink, 'stroke-width': 1.4 });
      }
      const r = svgEl('rect', attrs);
      r.addEventListener('mousemove', e => showTip(e,
        `<strong>Dia ${c.dayNum}</strong> · ${P66.Store.fmtDate(c.key)}<br>` +
        (c.state === 'future' ? 'Ainda por vir' : `${c.pct}% executado`)));
      r.addEventListener('mouseleave', hideTip);
      svg.appendChild(r);
    });
    el.appendChild(svg);
  }

  /* ---------- calendário mensal de execução ---------- */
  function calendar(el, year, month) {
    el.innerHTML = '';
    const S = P66.Store;
    const first = new Date(year, month, 1);
    const daysIn = new Date(year, month + 1, 0).getDate();
    const startWd = first.getDay();
    const head = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];
    const wrap = document.createElement('div');
    wrap.className = 'cal-grid';
    head.forEach(h => {
      const c = document.createElement('div');
      c.className = 'cal-head'; c.textContent = h;
      wrap.appendChild(c);
    });
    for (let i = 0; i < startWd; i++) wrap.appendChild(document.createElement('div'));
    for (let d = 1; d <= daysIn; d++) {
      const k = S.dkey(new Date(year, month, d));
      const cell = document.createElement('div');
      cell.className = 'cal-cell';
      const c = S.completionForDay(k);
      const isFuture = k > S.today();
      const inLog = !!S.day(k);
      if (!isFuture && inLog) {
        cell.style.background = heatColor(c.pct);
        if (c.pct >= 67) cell.classList.add('cal-dark-ink');
      } else if (!isFuture) {
        cell.style.background = V.heatZero;
      }
      if (k === S.today()) cell.classList.add('cal-today');
      if (isFuture) cell.classList.add('cal-future');
      cell.textContent = d;
      cell.addEventListener('mousemove', e => showTip(e,
        `<strong>${S.fmtDate(k)}</strong><br>` + (isFuture ? 'Ainda por vir' : (inLog ? `${c.done}/${c.total} hábitos · ${c.pct}%` : 'Sem registro'))));
      cell.addEventListener('mouseleave', hideTip);
      wrap.appendChild(cell);
    }
    el.appendChild(wrap);
  }

  /* ---------- medidor circular ---------- */
  function ringSVG(pct, opts = {}) {
    const size = opts.size || 92, sw = opts.stroke || 8;
    const r = (size - sw) / 2, c = 2 * Math.PI * r;
    const val = Math.max(0, Math.min(100, pct));
    const color = opts.color || (val >= 70 ? V.good : val >= 40 ? V.series[0] : V.bad);
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" class="ring" role="img" aria-label="${val}%">
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="${sw}"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="${color}" stroke-width="${sw}"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - val / 100)}"
        transform="rotate(-90 ${size / 2} ${size / 2})" class="ring-value"/>
      <text x="50%" y="50%" dy="0.36em" text-anchor="middle" fill="${V.ink}" font-size="${size * 0.24}" font-weight="700">${Math.round(val)}</text>
    </svg>`;
  }

  /* ---------- barras horizontais (força dos hábitos) ---------- */
  function hbars(el, data, opts = {}) {
    el.innerHTML = '';
    const rows = data.map(d => {
      const val = Math.max(0, Math.min(100, d.rate ?? d.value ?? 0));
      const color = opts.color || V.series[0];
      return `<div class="hbar-row" data-tip="${(d.tip || '').replace(/"/g, '&quot;')}">
        <span class="hbar-label">${d.label}</span>
        <span class="hbar-track"><span class="hbar-fill" style="width:${val}%;background:${color}"></span></span>
        <span class="hbar-val">${val}%</span>
      </div>`;
    }).join('');
    el.innerHTML = rows;
    el.querySelectorAll('.hbar-row[data-tip]').forEach(r => {
      const t = r.getAttribute('data-tip');
      if (!t) return;
      r.addEventListener('mousemove', e => showTip(e, t));
      r.addEventListener('mouseleave', hideTip);
    });
  }

  return { bars, line, heatmap, calendar, ringSVG, hbars, heatColor, showTip, hideTip };
})();

</script>
<script>
/* =============================================================
   PROJETO 66 — Claudi, o analista de execução.
   Motor 100% local: lê o histórico do Store, identifica padrões
   e devolve insights objetivos e orientados à ação.
   ============================================================= */
'use strict';

P66.Claudi = {

  greeting() {
    const S = P66.Store;
    const h = new Date().getHours();
    const nome = S.state.profile.name;
    if (h < 5) return `Madrugada de trabalho, ${nome}? Cuide também do sono.`;
    if (h < 12) return `Bom dia, ${nome}.`;
    if (h < 18) return `Boa tarde, ${nome}.`;
    return `Boa noite, ${nome}.`;
  },

  /* Análise diária completa — lista de insights ordenada por relevância */
  briefing() {
    const S = P66.Store;
    const out = [];
    const today = S.completionForDay(S.today());
    const late = S.lateHabitsToday();
    const hour = new Date().getHours();

    /* 1. Situação de hoje */
    if (today.pct === 100) {
      out.push({ tone: 'good', icon: 'trophy', title: 'Dia vencido', text: `100% executado. ${today.total} de ${today.total} hábitos. Registre sua reflexão e proteja o sono — amanhã o campo de batalha reabre às ${S.habits()[0]?.time || '05:30'}.` });
    } else if (late.length >= 3) {
      out.push({ tone: 'bad', icon: 'warning', title: `${late.length} hábitos atrasados`, text: `${late.map(h => h.name).join(', ')}. Não tente recuperar tudo de uma vez: execute o mais rápido primeiro (${late.slice().sort((a, b) => a.min - b.min)[0].name}) e recupere o ritmo.` });
    } else if (late.length > 0) {
      out.push({ tone: 'warn', icon: 'clock', title: 'Atenção ao relógio', text: `${late.map(h => h.name).join(' e ')} ${late.length > 1 ? 'passaram' : 'passou'} do horário planejado. Ainda dá tempo de fechar o dia em 100%.` });
    } else if (today.done > 0) {
      out.push({ tone: 'good', icon: 'check', title: 'Em dia com o plano', text: `${today.done} de ${today.total} concluídos e nenhum atraso. Mantenha o ritmo — o próximo é "${S.nextHabit()?.name || '—'}".` });
    }

    /* 2. Risco de quebrar o dia à noite */
    if (hour >= 20 && today.pct < 100 && today.pct > 0) {
      const pend = S.habits().filter(h => !S.isDone(h.id));
      out.push({ tone: 'warn', icon: 'moon', title: 'Reta final do dia', text: `Faltam ${pend.length}: ${pend.map(h => h.name).join(', ')}. ${pend.length <= 2 ? 'Dá para fechar 100% antes de dormir.' : 'Priorize os de maior XP e registre o motivo do que ficar para trás.'}` });
    }

    /* 3. Semana atual vs anterior */
    const thisWeekFrom = S.addDays(S.today(), -6);
    const prevWeekFrom = S.addDays(S.today(), -13);
    const prevWeekTo = S.addDays(S.today(), -7);
    const cur = S.rateBetween(thisWeekFrom, S.today());
    const prev = S.rateBetween(prevWeekFrom, prevWeekTo);
    if (cur !== null && prev !== null) {
      const d = cur - prev;
      if (d >= 5) out.push({ tone: 'good', icon: 'arrowUp', title: 'Tendência de evolução', text: `Sua execução subiu de ${prev}% para ${cur}% em relação à semana passada (+${d} pontos). O sistema está funcionando — não mexa no que está dando certo.` });
      else if (d <= -5) out.push({ tone: 'bad', icon: 'arrowDown', title: 'Tendência de regressão', text: `Execução caiu de ${prev}% para ${cur}% (${d} pontos) em relação à semana passada. Reveja o que mudou na rotina nos últimos 7 dias e corte a causa, não o sintoma.` });
      else out.push({ tone: 'info', icon: 'minus', title: 'Semana estável', text: `Execução em ${cur}% contra ${prev}% da semana anterior. Estabilidade é boa — o próximo passo é subir o padrão.` });
    }

    /* 4. Padrão de procrastinação: hábitos executados muito depois do horário */
    const strength = S.habitStrength();
    const procr = strength.filter(x => x.done >= 3 && x.avgDelay > 45);
    if (procr.length) {
      const w = procr[0];
      out.push({ tone: 'warn', icon: 'clock', title: 'Padrão de procrastinação detectado', text: `"${w.habit.name}" é executado em média ${w.avgDelay} min depois das ${w.habit.time}. Ou o horário está errado, ou há um gatilho de fuga antes dele. Sugestão: mova para outro horário ou prepare o ambiente na véspera.` });
    }

    /* 5. Gargalo: hábito mais fraco do ciclo */
    const weak = strength.filter(x => x.opp >= 3).slice(-1)[0];
    if (weak && weak.rate < 60) {
      out.push({ tone: 'bad', icon: 'target', title: 'Gargalo do ciclo', text: `"${weak.habit.name}" está em ${weak.rate}% de execução — é o elo mais fraco. Reduza o atrito: versão mínima de 5 minutos conta como vitória enquanto o hábito não se firma.` });
    }

    /* 6. Janela de ouro: horário em que você mais executa */
    const hist = S.hourHistogram();
    const totalEx = hist.reduce((a, b) => a + b, 0);
    if (totalEx >= 10) {
      const peak = hist.indexOf(Math.max(...hist));
      out.push({ tone: 'info', icon: 'sun', title: 'Sua janela de ouro', text: `A maior parte das suas execuções acontece por volta das ${String(peak).padStart(2, '0')}h. Agende o que é mais difícil perto desse horário — você joga melhor nesse campo.` });
    }

    /* 7. Melhor e pior dia da semana */
    const wd = S.weekdayRates().filter(x => x.n >= 2);
    if (wd.length >= 3) {
      const sorted = [...wd].sort((a, b) => b.pct - a.pct);
      const best = sorted[0], worst = sorted[sorted.length - 1];
      if (best.pct - worst.pct >= 15) {
        out.push({ tone: 'info', icon: 'calendar', title: `${worst.label} é seu dia crítico`, text: `Média de ${worst.pct}% contra ${best.pct}% de ${best.label}. Planeje as ${worst.label}s na véspera com padrão reduzido e inegociável.` });
      }
    }

    /* 8. Streak */
    const streak = S.currentStreak();
    const best = S.bestStreak();
    if (streak >= 3) {
      out.push({ tone: 'good', icon: 'flame', title: `${streak} dias perfeitos seguidos`, text: streak >= best ? 'É a sua melhor sequência até aqui. Proteja-a como patrimônio: a decisão de amanhã começa no sono de hoje.' : `Sua melhor marca é ${best}. Faltam ${best - streak + 1} dias para superá-la.` });
    }

    /* 9. Prioridades de amanhã */
    const lows = strength.filter(x => x.opp >= 2).slice(-3).reverse();
    if (lows.length === 3) {
      out.push({ tone: 'info', icon: 'flag', title: 'Prioridades para amanhã', text: `Comece o dia garantindo os três mais frágeis: ${lows.map(x => `"${x.habit.name}" (${x.rate}%)`).join(', ')}. Vitória neles cedo muda o dia inteiro.` });
    }

    if (!out.length) {
      out.push({ tone: 'info', icon: 'spark', title: 'Coletando dados', text: 'Ainda há pouco histórico para análise. Execute os hábitos de hoje — em poucos dias começo a apontar padrões, gargalos e tendências.' });
    }
    return out;
  },

  /* Mensagem curta e contextual para o dashboard */
  headline() {
    const S = P66.Store;
    const today = S.completionForDay(S.today());
    const late = S.lateHabitsToday();
    const h = new Date().getHours();
    if (today.pct === 100) return 'Missão do dia concluída. Hoje você venceu.';
    if (late.length >= 3) return `${late.length} batalhas atrasadas. Recupere uma agora — a mais curta primeiro.`;
    if (late.length > 0) return `"${late[0].name}" passou do horário. Execute e volte ao plano.`;
    const next = S.nextHabit();
    if (next) return `Próxima batalha: ${next.name} às ${next.time}.`;
    if (h >= 20) return 'Feche o dia com a reflexão e proteja o sono.';
    return 'Plano limpo. Execute.';
  },
};

</script>
<script>
/* =============================================================
   PROJETO 66 — Views: renderização de todas as telas.
   Cada view expõe render() -> HTML e mount(root) para gráficos
   e comportamentos pós-render. Eventos usam data-action
   (delegação central em app.js).
   ============================================================= */
'use strict';

P66.Views = (() => {
  const S = () => P66.Store;
  const C = () => P66.Charts;
  const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  const ic = n => `<span class="i">${P66.icon(n)}</span>`;

  /* ---------- helpers ---------- */
  function habitStreak(id) {
    let n = 0, k = S().today();
    if (S().isDone(id, k)) n = 1;
    k = S().addDays(k, -1);
    while (S().day(k) && S().isDone(id, k)) { n++; k = S().addDays(k, -1); }
    return n;
  }

  function habitStatus(h) {
    const iso = S().doneAt(h.id);
    if (iso) {
      const d = new Date(iso);
      return { key: 'done', label: `Concluído às ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}` };
    }
    const now = new Date();
    const [hh, mm] = h.time.split(':').map(Number);
    if (hh * 60 + mm < now.getHours() * 60 + now.getMinutes()) return { key: 'late', label: 'Atrasado' };
    return { key: 'pending', label: `Às ${h.time}` };
  }

  function tile(label, value, sub, tone) {
    return `<div class="tile ${tone ? 'tile-' + tone : ''}">
      <span class="tile-label">${label}</span>
      <span class="tile-value">${value}</span>
      ${sub ? `<span class="tile-sub">${sub}</span>` : ''}
    </div>`;
  }

  function sectionHead(title, sub) {
    return `<div class="section-head"><h2>${title}</h2>${sub ? `<p>${sub}</p>` : ''}</div>`;
  }

  function heatLegend() {
    const V = P66.VIZ;
    return `<div class="heat-legend"><span>Menos</span>
      ${[V.heatZero, ...V.heat].map(c => `<i style="background:${c}"></i>`).join('')}
      <span>Mais</span></div>`;
  }

  const PRIO = { alta: 'Alta', media: 'Média', baixa: 'Baixa' };

  function habitCard(h) {
    const st = habitStatus(h);
    const streak = habitStreak(h.id);
    return `<article class="habit-card ${st.key}" data-habit="${h.id}">
      <div class="habit-top">
        <span class="habit-icon">${P66.icon(h.icon)}</span>
        <span class="prio prio-${h.prio}">${PRIO[h.prio]}</span>
      </div>
      <h3 class="habit-name">${esc(h.name)}</h3>
      <p class="habit-goal">${esc(h.goal)}</p>
      <div class="habit-meta">
        <span title="Horário planejado">${ic('clock')}${h.time}</span>
        ${h.min ? `<span title="Tempo estimado">${h.min} min</span>` : ''}
        <span title="XP por conclusão">+${h.xp} XP</span>
      </div>
      <div class="habit-foot">
        <span class="habit-streak" title="Sequência de dias">${ic('flame')}${streak}</span>
        <span class="habit-status st-${st.key}">${st.label}</span>
        ${st.key === 'done'
          ? `<button class="btn btn-ghost btn-sm" data-action="undo-habit" data-id="${h.id}">Desfazer</button>`
          : `<button class="btn btn-primary btn-sm" data-action="complete-habit" data-id="${h.id}">Concluir</button>`}
      </div>
    </article>`;
  }

  /* =========================================================
     DASHBOARD
     ========================================================= */
  const dashboard = {
    render() {
      const st = S();
      const c = st.completionForDay(st.today());
      const remaining = c.total - c.done;
      const lvl = st.levelInfo();
      const h = new Date().getHours();
      const saud = h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite';
      return `
      <section class="hero">
        <p class="hero-kicker">Ciclo ${st.cycleNumber()} · ${st.fmtDateLong(st.today())}</p>
        <h1>${saud}, ${esc(st.state.profile.name)}.</h1>
        <p class="hero-line">Hoje é o <strong>Dia ${st.dayNumber()} de ${P66.CYCLE_DAYS}</strong>.</p>
        <p class="hero-line">${c.done > 0
          ? `Você já venceu <strong>${c.done} ${c.done === 1 ? 'batalha' : 'batalhas'}</strong> hoje. ${remaining > 0 ? `${remaining === 1 ? 'Falta' : 'Faltam'} <strong>${remaining}</strong>.` : ''}`
          : `<strong>${c.total} batalhas</strong> esperam por você hoje.`}</p>
      </section>

      <section class="mission-bar-wrap ${c.pct === 100 ? 'complete' : ''}">
        <div class="mission-bar-head">
          <span class="mission-bar-title">MISSÃO DO DIA</span>
          <span class="mission-bar-pct">${c.pct}%</span>
        </div>
        <div class="mission-bar"><div class="mission-bar-fill" style="width:${c.pct}%"></div></div>
        <p class="mission-bar-note">${P66.Claudi.headline()}</p>
      </section>

      <section class="quick-tiles">
        ${tile('Sequência atual', `${st.currentStreak()} <small>dias</small>`, `Recorde: ${st.bestStreak()}`)}
        ${tile('Patente', `Nv ${lvl.level}`, lvl.name)}
        ${tile('XP total', lvl.xp.toLocaleString('pt-BR'), lvl.next ? `${lvl.next.xp - lvl.xp} até ${lvl.next.name}` : 'Patente máxima')}
        ${tile('Dias restantes', st.daysLeft(), 'no ciclo de 66')}
      </section>

      ${sectionHead('Painel dos 10 hábitos', 'Cada cartão é uma batalha. Vença todas e o dia é seu.')}
      <section class="habit-grid">
        ${st.habits().map(habitCard).join('')}
      </section>`;
    },
    mount() {},
  };

  /* =========================================================
     HOJE — timeline
     ========================================================= */
  const hoje = {
    render() {
      const st = S();
      const habits = [...st.habits()].sort((a, b) => a.time.localeCompare(b.time));
      const next = st.nextHabit();
      const c = st.completionForDay(st.today());
      return `
      ${sectionHead('Hoje', `${st.fmtDateLong(st.today())} · ${c.done}/${c.total} concluídos`)}
      <section class="timeline">
        ${habits.map(h => {
          const stt = habitStatus(h);
          const isNext = next && next.id === h.id && stt.key !== 'done';
          return `<div class="tl-item ${stt.key} ${isNext ? 'next' : ''}">
