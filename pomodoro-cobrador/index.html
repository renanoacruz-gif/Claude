<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cobrador de Pomodoro</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, Arial, sans-serif;
    background: #1e1e2e; color: #f0f0f0;
    display: flex; align-items: center; justify-content: center;
  }
  .screen { width: 100%; padding: 30px; box-sizing: border-box; text-align: center; }
  input {
    font-size: 18px; padding: 8px; width: 80%; border-radius: 6px;
    border: none; margin: 10px 0;
  }
  button {
    font-size: 16px; padding: 10px 18px; margin: 6px; border-radius: 6px;
    border: none; cursor: pointer; background: #4caf50; color: white;
  }
  button.no { background: #e53935; }
  #timer { font-size: 48px; margin: 20px 0; font-weight: bold; }
  .hidden { display: none; }

  #alertOverlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #b30000; color: white; z-index: 999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    animation: flash 1s infinite;
    text-align: center; padding: 20px; box-sizing: border-box;
  }
  @keyframes flash {
    0%, 50% { background: #b30000; }
    51%, 100% { background: #ff4d4d; }
  }
  #alertOverlay h1 { font-size: 32px; }
  #scold { font-size: 20px; margin: 20px 0; }
</style>
</head>
<body>

<div class="screen" id="setupScreen">
  <h1>🍅 Cobrador de Pomodoro</h1>
  <p>Qual a tarefa atual?</p>
  <input type="text" id="taskInput" placeholder="Ex: Escrever relatório">
  <br>
  <button id="startBtn">Iniciar Foco (25 min)</button>
</div>

<div class="screen hidden" id="timerScreen">
  <h2 id="currentTaskLabel"></h2>
  <div id="timer">25:00</div>
</div>

<div id="alertOverlay" class="hidden">
  <h1>⏰ Tempo esgotado!</h1>
  <p id="alertText"></p>
  <div>
    <button id="simBtn">SIM</button>
    <button class="no" id="naoBtn">NÃO</button>
  </div>
  <p id="scold" class="hidden"></p>
  <div id="choiceBtns" class="hidden">
    <button id="continueBtn">Continuar mais 10 min</button>
    <button class="no" id="pauseBtn">Pausa de 5 min</button>
  </div>
</div>

<script>
const setupScreen = document.getElementById('setupScreen');
const timerScreen = document.getElementById('timerScreen');
const taskInput = document.getElementById('taskInput');
const startBtn = document.getElementById('startBtn');
const timerEl = document.getElementById('timer');
const currentTaskLabel = document.getElementById('currentTaskLabel');

const alertOverlay = document.getElementById('alertOverlay');
const alertText = document.getElementById('alertText');
const simBtn = document.getElementById('simBtn');
const naoBtn = document.getElementById('naoBtn');
const scold = document.getElementById('scold');
const choiceBtns = document.getElementById('choiceBtns');
const continueBtn = document.getElementById('continueBtn');
const pauseBtn = document.getElementById('pauseBtn');

let currentTask = '';
let countdownInterval = null;
let beepInterval = null;

function beep() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'square';
  osc.frequency.value = 880;
  osc.connect(gain);
  gain.connect(ctx.destination);
  gain.gain.setValueAtTime(0.3, ctx.currentTime);
  osc.start();
  osc.stop(ctx.currentTime + 0.3);
  osc.onended = () => ctx.close();
}

function tripleBeep() {
  beep();
  setTimeout(beep, 350);
  setTimeout(beep, 700);
}

function formatTime(totalSeconds) {
  const m = Math.floor(totalSeconds / 60);
  const s = totalSeconds % 60;
  return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function startCountdown(minutes, label, isPause) {
  let remaining = minutes * 60;
  currentTaskLabel.textContent = label;
  timerEl.textContent = formatTime(remaining);
  setupScreen.classList.add('hidden');
  timerScreen.classList.remove('hidden');

  countdownInterval = setInterval(() => {
    remaining--;
    timerEl.textContent = formatTime(remaining);
    if (remaining <= 0) {
      clearInterval(countdownInterval);
      if (isPause) {
        startCountdown(25, `Foco: ${currentTask}`);
      } else {
        triggerAlert();
      }
    }
  }, 1000);
}

function triggerAlert() {
  alertText.textContent = `Você terminou a tarefa "${currentTask}"?`;
  scold.classList.add('hidden');
  choiceBtns.classList.add('hidden');
  simBtn.classList.remove('hidden');
  naoBtn.classList.remove('hidden');
  alertOverlay.classList.remove('hidden');

  tripleBeep();
  beepInterval = setInterval(tripleBeep, 10000);
}

function stopBeeping() {
  if (beepInterval) {
    clearInterval(beepInterval);
    beepInterval = null;
  }
}

simBtn.addEventListener('click', async () => {
  stopBeeping();
  alertOverlay.classList.add('hidden');
  const line = `${new Date().toLocaleString()} | ${currentTask} | Concluída com sucesso`;
  await window.electronAPI.appendLog(line);
  timerScreen.classList.add('hidden');
  setupScreen.classList.remove('hidden');
  taskInput.value = '';
  taskInput.focus();
});

naoBtn.addEventListener('click', async () => {
  stopBeeping();
  const line = `${new Date().toLocaleString()} | ${currentTask} | Não concluída`;
  await window.electronAPI.appendLog(line);

  simBtn.classList.add('hidden');
  naoBtn.classList.add('hidden');
  alertText.textContent = '';
  scold.textContent = '🙄 Sério? Você se distraiu de novo. Foco, vai!';
  scold.classList.remove('hidden');
  choiceBtns.classList.remove('hidden');
});

continueBtn.addEventListener('click', () => {
  alertOverlay.classList.add('hidden');
  startCountdown(10, `Foco (continuação): ${currentTask}`);
});

pauseBtn.addEventListener('click', () => {
  alertOverlay.classList.add('hidden');
  startCountdown(5, 'Pausa ☕', true);
});

startBtn.addEventListener('click', () => {
  const task = taskInput.value.trim();
  if (!task) {
    alert('Digite a tarefa atual.');
    return;
  }
  currentTask = task;
  startCountdown(25, `Foco: ${currentTask}`);
});

taskInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') startBtn.click();
});
</script>

</body>
</html>
